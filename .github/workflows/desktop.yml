name: Desktop

# Desktop installers (client/desktop, docs/03_开发计划/客户端桌面应用-技术设计.md §9 "CI"):
# each target is built on its own platform and smoke tested there; a version tag attaches them to its release.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "client/desktop/**"
      - "client/package.json"
      - "client/pnpm-lock.yaml"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            os: macos-15
          - target: darwin-x64
            os: macos-15-intel
          - target: win32-x64
            os: windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.10.0
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Package
        env:
          # electron-builder skips signing on pull request builds unless told otherwise. The macOS signature is ad hoc
          # (no secrets), and an unsigned app is what the disk image check below must catch, so sign every build.
          CSC_FOR_PULL_REQUEST: "true"
        run: node desktop/scripts/dist.mjs --target ${{ matrix.target }} --skip-build

      - name: Smoke test the app (macOS)
        if: runner.os == 'macOS'
        run: node desktop/scripts/smoke.mjs
      - name: Smoke test the disk image (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          dmg=$(ls dist-desktop/SuDuo-*-mac-*.dmg)
          mount=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg"
          trap 'hdiutil detach "$mount" -force' EXIT
          codesign --verify --deep --strict "$mount/SuDuo.app"
          # Node and Codex keep their publishers' signatures (technical design §3 decision 5).
          codesign -dv "$mount/SuDuo.app/Contents/Resources/node/node" 2>&1 | grep -q "TeamIdentifier=HX7739G8FX"
          codesign -dv "$mount"/SuDuo.app/Contents/Resources/codex/*/bin/codex 2>&1 | grep -q "TeamIdentifier=2DC432GLL2"
          node desktop/scripts/smoke.mjs --app "$mount/SuDuo.app"

      - name: Smoke test the app (Windows)
        if: runner.os == 'Windows'
        run: node desktop/scripts/smoke.mjs
      - name: Install, smoke test and uninstall (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Get-ChildItem dist-desktop -Filter 'SuDuo-Setup-*.exe' | Select-Object -First 1).FullName
          $install = Start-Process -FilePath $installer -ArgumentList '/S' -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "installer exited with $($install.ExitCode)" }
          $app = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter 'SuDuo.exe' | Select-Object -First 1
          if (-not $app) { throw 'SuDuo.exe was not installed under %LOCALAPPDATA%\Programs' }
          Write-Host "Installed at $($app.FullName)"
          node desktop/scripts/smoke.mjs --app $app.FullName
          if ($LASTEXITCODE -ne 0) { throw 'smoke test of the installed app failed' }
          $uninstaller = Get-ChildItem $app.DirectoryName -Filter 'Uninstall*.exe' | Select-Object -First 1
          Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait
          # The NSIS uninstaller re-launches itself from a temp copy and returns at once; wait for the files to go.
          for ($i = 0; $i -lt 60 -and (Test-Path $app.FullName); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $app.FullName) { throw 'uninstall left SuDuo.exe behind' }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.target }}
          path: |
            client/dist-desktop/SuDuo-*.dmg
            client/dist-desktop/SuDuo-Setup-*.exe
            client/dist-desktop/SHA256SUMS-*.txt
            client/dist-desktop/latest*.yml
            client/dist-desktop/*.blockmap
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: attach to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Only the script that merges the two Macs' update info (no dependencies to install).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: client/desktop/scripts/merge-update-info.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: Attach installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        working-directory: artifacts
        run: |
          set -euo pipefail
          cat SHA256SUMS-*.txt > SHA256SUMS.txt
          rm SHA256SUMS-*.txt
          cat SHA256SUMS.txt
          # In-app updates (D3): each Mac build wrote latest-mac-<arch>.yml; electron-updater reads one latest-mac.yml
          # and picks its own architecture's file. latest.yml (Windows) comes from the Windows build as is.
          node ../client/desktop/scripts/merge-update-info.mjs latest-mac.yml latest-mac-*.yml
          rm latest-mac-*.yml
          cat latest-mac.yml latest.yml
          # The release is normally written by hand before the tag is pushed (as a draft); create a draft if it isn't there.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "SuDuo ${TAG#v}" \
                 --notes "Desktop installers attached by the Desktop workflow; release notes to follow."
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber SuDuo-*.dmg SuDuo-Setup-*.exe SHA256SUMS.txt latest.yml latest-mac.yml *.blockmap
