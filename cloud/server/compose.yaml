name: suduo-requirements-service

services:
  postgres:
    # 镜像仓库前缀可替换（国内服务器：./scripts/suduo-cloud.sh install --mirror cn）；版本标签固定在这里，随代码升级。
    image: ${SUDUO_IMAGE_REGISTRY:-docker.io/library}/postgres:17.4-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?请先从 .env.example 创建 .env 并设置 POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?请先从 .env.example 创建 .env 并设置 POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先从 .env.example 创建 .env 并设置 POSTGRES_PASSWORD}
    volumes:
      - requirements_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  requirements-service:
    build:
      context: ..
      dockerfile: server/Dockerfile
      args:
        NODE_IMAGE: ${SUDUO_IMAGE_REGISTRY:-docker.io/library}/node:24.10.0-bookworm-slim
        NPM_REGISTRY: ${SUDUO_NPM_REGISTRY:-https://registry.npmjs.org}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REQUIREMENTS_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      # 默认在所有地址（IPv4 与 IPv6）上开放；只想对本机开放时用 server/compose.override.yaml 覆盖，见 cloud/DEPLOYMENT.md。
      - "${REQUIREMENTS_PORT:-4100}:${REQUIREMENTS_PORT:-4100}"
    volumes:
      - requirements_attachments:/var/lib/suduo/attachments
      - requirements_room_files:/var/lib/suduo/room-files
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  requirements_postgres_data:
  requirements_attachments:
  requirements_room_files:
